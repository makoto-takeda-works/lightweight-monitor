[package]
name = "sysmon-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 非同期処理・タイマー用
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# HTTPリクエスト用 (JSON自動シリアライズ機能つき)
reqwest = { version = "0.11", features = ["json"] }
